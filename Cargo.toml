[workspace]
members = ["crates/tangent-midi", "crates/tangent-midi-web"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
tangent-midi = { path = "crates/tangent-midi" }
midly = { version = "=0.5.3", default-features = false, features = ["std", "strict"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
