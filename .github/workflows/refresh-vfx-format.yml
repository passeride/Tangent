name: Format VFX branch
on:
  push:
    branches: [feature/hanabi-note-vfx]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit rustfmt changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/tangent-player/src/scene
            git commit -m "chore(vfx): apply rustfmt"
            git push origin HEAD:feature/hanabi-note-vfx
          fi
