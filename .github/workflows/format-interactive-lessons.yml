name: Format interactive lessons (temporary)
on:
  push:
    branches: [feat/interactive-music-lessons]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interactive-music-lessons
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - name: Format Rust modules
        run: cargo fmt --all
      - name: Push formatting results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tangent-core crates/tangent-player
          if ! git diff --cached --quiet; then
            git commit -m "style: rustfmt interactive lesson implementation"
            git push origin HEAD:feat/interactive-music-lessons
          fi
