name: Build and publish Tangent
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tangent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Web · WASM build and package
    # Playwright 1.56 needs Ubuntu 24.04; keep the same distro for build/test.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo test -p tangent-musicxml --locked
      - run: cargo test -p tangent-core --locked
      - run: cargo clippy -p tangent-player --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build optimized WASM
        timeout-minutes: 35
        run: cargo build -p tangent-midi-web -p tangent-player --target wasm32-unknown-unknown --release --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/tangent_midi_web.wasm --target web --out-dir web/midi-import/pkg
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/tangent_player.wasm --target web --out-dir web/piano/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/piano/package-lock.json
      # postinstall places the pinned sql.js WASM files under web/piano/vendor.
      - run: npm ci --prefix web/piano
      - run: python scripts/package_web.py
      - name: Prepare WASM for parallel browser test jobs
        run: |
          mkdir -p dist/ci-wasm/piano dist/ci-wasm/midi-import
          cp -R web/piano/pkg dist/ci-wasm/piano/
          cp -R web/midi-import/pkg dist/ci-wasm/midi-import/
      - uses: actions/upload-artifact@v4
        with:
          name: tangent-web-test-bundle
          path: dist/ci-wasm/
          retention-days: 3
          if-no-files-found: error
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: tangent-piano-web
          path: dist/piano
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist/piano

  browser:
    name: Browser · ${{ matrix.shard }}
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [foundations, practice, interface, sequences]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/midi-import/package-lock.json
            web/piano/package-lock.json
      # Download the single already-built WASM pair instead of recompiling it
      # four times. Artifact layout restores web/{piano,midi-import}/pkg.
      - uses: actions/download-artifact@v4
        with:
          name: tangent-web-test-bundle
          path: web
      - run: npm ci --prefix web/midi-import
      - run: npm ci --prefix web/piano
      - name: Install Chromium and system dependencies
        run: cd web/piano && npx playwright install --with-deps chromium
      - name: Run ${{ matrix.shard }} browser tests
        timeout-minutes: 22
        run: node web/piano/ci-shard.mjs ${{ matrix.shard }}
      - uses: actions/download-artifact@v4
        if: matrix.shard == 'foundations'
        with:
          name: tangent-piano-web
          path: dist/piano
      - name: Test published GitHub Pages paths and audio
        if: matrix.shard == 'foundations'
        timeout-minutes: 6
        run: node web/piano/site-smoke.mjs dist/piano
  native:
    name: ${{ matrix.name }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, binary: tangent.exe }
          # - { name: Windows ARM64, os: windows-11-arm, target: aarch64-pc-windows-msvc, binary: tangent.exe }
          - { name: Linux x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, binary: tangent }
          # - { name: Linux ARM64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, binary: tangent }
          # - { name: macOS Intel, os: macos-15-intel, target: x86_64-apple-darwin, binary: tangent }
          # - { name: macOS Apple Silicon, os: macos-15, target: aarch64-apple-darwin, binary: tangent }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux native window/audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --target ${{ matrix.target }} --locked
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - name: Build native Bevy desktop (no WASM/web server)
        timeout-minutes: 30
        # Single-codegen-unit release is needed for WASM, not native desktop.
        # More CGUs reduce Windows LLVM compilation time at a small binary-speed cost.
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
        run: cargo build -p tangent-desktop --release --target ${{ matrix.target }} --locked
      - name: Test the real platform executable
        run: python scripts/smoke_desktop.py target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Embed and verify Windows executable icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/create_icon.py --output "$env:RUNNER_TEMP\Tangent.ico"
          ./scripts/embed_windows_icon.ps1 -Exe "target/${{ matrix.target }}/release/${{ matrix.binary }}" -Icon "$env:RUNNER_TEMP\Tangent.ico"
      - name: Stage minimal platform download
        run: python scripts/package_desktop.py --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: Tangent-${{ matrix.target }}
          path: dist/Tangent-${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 6
  deploy:
    name: Publish GitHub Pages
    needs: [web, browser, native]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
