name: Build and publish Tangent
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tangent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Web · WASM and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo test -p tangent-musicxml --locked
      - run: cargo test -p tangent-core --locked
      - run: cargo clippy -p tangent-player --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo build -p tangent-midi-web -p tangent-player --target wasm32-unknown-unknown --release --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/tangent_midi_web.wasm --target web --out-dir web/midi-import/pkg
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/tangent_player.wasm --target web --out-dir web/piano/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/midi-import/package-lock.json
            web/piano/package-lock.json
      - run: npm ci --prefix web/midi-import
      - run: npm ci --prefix web/piano
      - run: cd web/piano && npx playwright install --with-deps chromium
      - run: npm test --prefix web/midi-import
      - run: npm test --prefix web/piano
      - name: Preserve browser build for failed-test reproduction
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tangent-web-debug
          path: web/piano/pkg
          if-no-files-found: ignore
          retention-days: 3
      - run: python scripts/package_web.py
      - name: Test packaged site under the GitHub Pages project path
        run: node web/piano/site-smoke.mjs dist/piano
      - uses: actions/upload-artifact@v4
        with:
          name: tangent-piano-web
          path: dist/piano
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist/piano
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, binary: tangent.exe }
          # - { name: Windows ARM64, os: windows-11-arm, target: aarch64-pc-windows-msvc, binary: tangent.exe }
          - { name: Linux x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, binary: tangent }
          # - { name: Linux ARM64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, binary: tangent }
          # - { name: macOS Intel, os: macos-15-intel, target: x86_64-apple-darwin, binary: tangent }
          # - { name: macOS Apple Silicon, os: macos-15, target: aarch64-apple-darwin, binary: tangent }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux native window/audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --target ${{ matrix.target }} --locked
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - name: Build native Bevy desktop (no WASM/web server)
        run: cargo build -p tangent-desktop --release --target ${{ matrix.target }} --locked
      - name: Test the real platform executable
        run: python scripts/smoke_desktop.py target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Embed and verify Windows executable icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/create_icon.py --output "$env:RUNNER_TEMP\Tangent.ico"
          ./scripts/embed_windows_icon.ps1 -Exe "target/${{ matrix.target }}/release/${{ matrix.binary }}" -Icon "$env:RUNNER_TEMP\Tangent.ico"
      - name: Stage minimal platform download
        run: python scripts/package_desktop.py --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: Tangent-${{ matrix.target }}
          path: dist/Tangent-${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 6
  deploy:
    name: Publish GitHub Pages
    needs: [web, native]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
