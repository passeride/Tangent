name: Refresh Hanabi branch build inputs
on:
  push:
    branches:
      - feature/hanabi-note-vfx
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'passeride/Tangent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit generated lockfile and rustfmt changes on feature branch only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock crates/tangent-player/src/scene
            git commit -m "chore(vfx): normalize rustfmt and regenerate Cargo.lock"
            git push origin HEAD:feature/hanabi-note-vfx
          fi
